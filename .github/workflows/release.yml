name: release

# 发版入口 = 在 GitHub 上「发布一个 Release」：
#   Releases → Draft a new release → 选 tag vX.Y.Z → Publish release
# Publish 的那一刻触发本 workflow，跑 bloom-release 把 8 个包的打包文件
# 推到 rcf_ros2-release 仓，再由 build.ros.org 编译成 deb。
#
# 为什么不用「push tag」触发：发布是要人确认的动作，推 tag 只是内部动作；
# Release 页面正好就是那个确认界面，顺便把 release notes 写了。
# 注意：Draft 状态不触发，只有 Publish 才触发。

on:
  release:
    types: [published]
  # 兜底：不建 Release 直接重跑（例如只修打包，产出 X.Y.Z-2）
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号，如 0.7.0（tag v0.7.0 必须已经存在）"
        required: true
        type: string
      new_track:
        description: "新版本号（勾选=改 tracks.yaml）；取消勾选=只重打同一版本的包（0.6.0-2）"
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  bloom-release:
    name: bloom-release (${{ github.event.release.tag_name || inputs.version || github.ref_name }})
    # 预发布（pre-release）不发布到 apt
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ros:jazzy
      options: --user root
    env:
      RELEASE_REPO_URL: https://github.com/robot-control-frame/rcf_ros2-release.git
      UPSTREAM_URL: https://github.com/robot-control-frame/rcf_ros2
      REPO_NAME: rcf_ros2
      DEVEL_BRANCH: main
      ROS_DISTRO: jazzy
      RELEASE_INC: "1"
    steps:
      - name: Checkout（含 tag，bloom 要用 v<version> 导出源码）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 修复 git safe.directory（容器里以 root 运行，工作区属主是 runner）
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 解析版本号并检查是否已发布
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${RELEASE_TAG:-$INPUT_VERSION}"
          [ -n "$v" ] || v="$GITHUB_REF_NAME"
          v="${v#v}"
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "releasing version: $v"

          git rev-parse --verify --quiet "refs/tags/v$v" >/dev/null || {
            echo "::error::tag v$v 不存在，请先 catkin_prepare_release 并 push tag"; exit 1; }

          # 幂等：同一版本的 -1 已经在 release 仓里就别再跑一遍
          # （只重打包装的场景请用 workflow_dispatch 并取消勾选 new_track）
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.new_track }}" != "false" ]; then
            # 注意：不要写 git ls-remote | grep -q，grep -q 会提前退出让 git 收到 SIGPIPE，
            # 在 pipefail 下整条管道被判失败（0.7.0 发布时就踩了这个坑）。
            tags="$(git ls-remote --tags "$RELEASE_REPO_URL" 2>/dev/null || true)"
            case "$tags" in
              *"refs/tags/release/$ROS_DISTRO/rcf_common/$v-1"*)
                echo "::notice::$v-1 已经在 release 仓里，跳过。要重打请用 workflow_dispatch 并取消勾选 new_track"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 安装 bloom / rosdep / 打包工具
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-bloom python3-pexpect python3-rosdep \
            fakeroot debhelper dh-make git ca-certificates
          rosdep init 2>/dev/null || true
          rosdep update --rosdistro "$ROS_DISTRO"

      - name: 配置 git 身份与凭据（推 release 仓需要 PAT）
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config --global user.name "rcf release bot"
          git config --global user.email "liaolunjia@gmail.com"
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$RELEASE_TOKEN" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          git config --global http.version HTTP/1.1

      - name: bloom-release
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          extra=""
          if [ "${{ inputs.new_track }}" = "false" ]; then extra="--no-new-track"; fi
          python3 scripts/bloom_release.py --version "${{ steps.version.outputs.value }}" $extra

      - name: 校验生成的 tag 已推到 release 仓
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          v="${{ steps.version.outputs.value }}"
          # GitHub 的 tag 复制有秒级延迟：bloom 刚 push 完，ls-remote 可能还看不到，
          # 所以这里重试，别因为延迟误判失败（0.7.0 就踩过）。
          for i in $(seq 1 10); do
            tags="$(git ls-remote --tags "$RELEASE_REPO_URL" 2>/dev/null || true)"
            case "$tags" in
              *"release/$ROS_DISTRO/rcf_common/$v-1"*)
                echo "::notice::已发布 $v-1。下一步：把 rosdistro 里 rcf_ros2 的 release.version 改成 $v-1"
                exit 0
                ;;
            esac
            echo "第 $i 次没看到 $v-1，5s 后重试"
            sleep 5
          done
          echo "::error::release 仓里没有 release/$ROS_DISTRO/rcf_common/$v-1"
          exit 1
