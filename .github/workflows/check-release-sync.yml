name: check-release-sync

# 每天检查一次：源码仓最新的 v* tag 有没有真的发布到 release 仓。
# 因为发版要人工去 Releases 页面点 Publish，忘了点就会「tag 有、deb 没有」，
# 而且不会有任何报错。这个 job 负责把这种静默失败暴露成一个 issue。

on:
  schedule:
    - cron: "17 3 * * *" # 每天 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-release-sync
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_REPO_URL: https://github.com/robot-control-frame/rcf_ros2-release.git
      ROS_DISTRO: jazzy
    steps:
      - name: 对比最新 tag 与 release 仓
        id: diff
        shell: bash
        run: |
          latest=$(git ls-remote --tags "https://github.com/${{ github.repository }}" \
            | sed 's:.*refs/tags/::; s/\^{}//' | grep -E '^v[0-9]' | sort -u | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "::notice::源码仓还没有 v* tag，跳过"
            echo "missing=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v="${latest#v}"
          echo "latest tag: $latest"

          if git ls-remote --tags "$RELEASE_REPO_URL" 2>/dev/null \
             | grep -q "refs/tags/release/$ROS_DISTRO/rcf_common/$v-1$"; then
            echo "::notice::$latest 已发布（release/$ROS_DISTRO/rcf_common/$v-1 存在），一切正常"
            echo "missing=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$latest 没有对应的 release/$ROS_DISTRO/rcf_common/$v-1"
            echo "missing=$v" >> "$GITHUB_OUTPUT"
          fi

      - name: 开 issue 提醒
        if: steps.diff.outputs.missing != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.diff.outputs.missing }}
        run: |
          open_issues="$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "in:title 发布未完成" --json number --jq '.[].number' || true)"
          if [ -n "$open_issues" ]; then
            echo "::notice::已经有未关闭的提醒 issue，不重复创建"
            exit 0
          fi

          body=$(printf '%s\n' \
            "源码仓已经有 tag \`v$V\`，但 rcf_ros2-release 仓里没有" \
            "\`release/$ROS_DISTRO/rcf_common/$V-1\` —— 说明 Release 没有 Publish，" \
            "或者 release workflow 失败了。" \
            "" \
            "修复方式（任选其一）：" \
            "" \
            "1. Releases 页面找到 v$V 的 draft，点 **Publish release**；" \
            "2. Actions → **release** → Run workflow，填 \`$V\`。" \
            "" \
            "发版成功后再把这个 issue 关掉。")

          gh issue create --repo "${{ github.repository }}" \
            --title "发布未完成：v$V 还没有推到 release 仓" \
            --body "$body"
