name: prepare-release

# 手动触发：升版本号 + 生成 CHANGELOG + 提交 + 打 tag + push。
#
# 这一步只负责「准备好一个 tag」。真正发版要在 GitHub 上建 Release 并 Publish，
# 由 release.yml 接手跑 bloom-release（所以这里推 tag 不会直接发版）。
#
# 用 PAT（secrets.RELEASE_TOKEN）是为了让 push 到 main 能正常触发 PR/CI，
# GITHUB_TOKEN 推的提交不会触发其他 workflow。

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "版本号变化"
        required: true
        type: choice
        default: minor
        options:
          - minor
          - patch

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ros:jazzy
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: 修复 git safe.directory（容器里以 root 运行，工作区属主是 runner）
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 安装 catkin_pkg / catkin 发布工具
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-catkin-pkg python3-catkin-pkg-modules git

      - name: 生成 CHANGELOG
        shell: bash
        run: |
          git config user.name "rcf release bot"
          git config user.email "liaolunjia@gmail.com"
          # 注意：--all 只用于「第一次给所有包建 CHANGELOG」，日常追加必须不带 --all
          # （逐包交互询问，用 yes 喂 y）。之前写 --all ... || true，结果每次都静默失败，
          # CHANGELOG 一直没更新。
          set +o pipefail
          yes y | catkin_generate_changelog
          set -o pipefail
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: 更新 CHANGELOG"
          fi

      - name: 升版本号并打 tag
        id: bump
        shell: bash
        run: |
          catkin_prepare_release --bump "${{ inputs.bump }}" --no-push -y -t v
          version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' rcf_common/package.xml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "next version: $version"

      - name: Push 提交与 tag
        shell: bash
        run: |
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"
          echo "::notice::tag v${{ steps.bump.outputs.version }} 已推送。下一步：Releases → Draft a new release → 选这个 tag → Publish，才会真正发版"
