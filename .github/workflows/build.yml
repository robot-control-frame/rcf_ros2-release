name: build

# 只在对 main 的 Pull Request 上跑（以及手动触发），push 不跑。
# 目的：合并前用一台干净的机器验证格式、colcon build 和单元测试能过，
# 而不是靠每个人本地环境碰运气。

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: 格式校验（C++ / Python）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装格式化工具
        # 版本全部钉死：格式化工具一升级，同一份代码可能突然“全部不合规范”。
        # 本地也要用同样的版本，否则改完推上去还是红。
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          pipx install ruff==0.17.4
          clang-format-18 --version
          ruff --version

      - name: 按 .clang-format 校验所有 C++ 文件
        run: |
          files=$(git ls-files '*.h' '*.hpp' '*.c' '*.cc' '*.cpp' '*.cxx')
          echo "检查 $(echo "$files" | wc -l) 个文件"
          bad=""
          for f in $files; do
            if ! clang-format-18 --dry-run --Werror "$f"; then
              bad="$bad $f"
            fi
          done
          if [ -n "$bad" ]; then
            echo ""
            echo "::error::以下文件不符合 .clang-format:$bad"
            echo ""
            echo "本地修复（需要 clang-format 18）："
            echo "  git ls-files '*.h' '*.hpp' '*.c' '*.cc' '*.cpp' '*.cxx' | xargs clang-format-18 -i"
            exit 1
          fi
          echo "C++ 检查通过"

      - name: 按 .ruff.toml 校验 Python
        run: |
          files=$(git ls-files '*.py')
          echo "检查 $(echo "$files" | wc -l) 个文件"
          ruff format --check --diff $files


  colcon:
    name: colcon build + test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ros:jazzy-ros-base
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 colcon 与 rosdep
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-rosdep git ca-certificates
          rosdep init 2>/dev/null || true
          rosdep update --rosdistro jazzy

      - name: 升级 ROS 包到最新同步版本
        # 官方 ros:jazzy 镜像可能是几个月前的快照；代码里用到的 CMake target
        # （如 geometry_msgs::geometry_msgs 别名）只在较新的 rosidl 里才有，
        # build.ros.org 编译时也是拿最新 apt 版本，这里保持一致。
        shell: bash
        run: |
          apt-get -y upgrade

      - name: 安装依赖（只补真正缺的）
        shell: bash
        run: |
          rosdep install --from-paths . --ignore-src --rosdistro jazzy -y --as-root apt:false

      # GitHub 启动 container 作业时会覆盖 entrypoint（--entrypoint tail -f /dev/null），
      # 镜像自带的 /ros_entrypoint.sh 不会执行，所以每个需要 ROS 环境的 step
      # 都要自己 source 一次，否则 cmake 找不到 ament_cmake。
      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --event-handlers console_cohesion+

      - name: colcon test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure

      - name: 测试结果汇总
        if: always()
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test-result --verbose
